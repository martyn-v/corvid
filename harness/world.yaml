# The minimal persona file. One file holds both personas.
# The generator reads this file. The agent never sees it.
# Everything here is ground truth.

personas:
  # Persona A: states everything. The control.
  - id: nordfrost
    company: Nordfrost Seafood AB
    contact:
      name: Erik Lindqvist
      email: elindqvist@nordfrost.example.com
    origin: { name: "Gothenburg, Sweden", locode: SEGOT }
    destination: { name: "Bogotá, Colombia", locode: COBOG }
    mode: ocean_reefer
    commodity: frozen seafood
    omit_origin: false
    style:
      language: en
      tone: terse, all business, no pleasantries

  # Persona B: omits the origin in most emails, and moves once.
  - id: acme-alimentos
    company: ACME Alimentos SAS
    contact:
      name: Marta Restrepo
      email: marta.restrepo@acme-alimentos.example.com
    origin: { name: "Bogotá, Colombia", locode: COBOG }
    destination: { name: "Rotterdam, Netherlands", locode: NLRTM }
    mode: ocean_fcl
    commodity: packaged non-perishable foods
    omit_origin: true # seeded coin flip per email
    change: # the supersession test
      at_email: 10
      origin: { name: "Cartagena, Colombia", locode: COCTG }
      reason_in_email: "we moved our export operation to the coast"
    style:
      language: en
      tone: warm, informal, opens with a pleasantry

# Generation settings.
generation:
  seed: 42
  emails_per_persona: 15
  # Chance an omit_origin persona omits it, per email (seeded coin flip).
  omission_rate: 0.7
  timeline:
    start_date: 2023-01-01
    start_offset_days: { min: 0, max: 5 } # first email, relative to start_date
    gap_days: { min: 3, max: 10 } # between a persona's emails
  # The model that renders facts into prose. Part of the world's definition:
  # the email cache is keyed on file existence, so the rendered emails were
  # written by whatever model this named at the time.
  renderer:
    model: ollama/qwen3.5:9b
    temperature: 0.7
  # Per-email variables, drawn seeded. Never memory material.
  variables:
    pieces: { min: 8, max: 26 }
    weight_kg: { min: 4000, max: 12000 }
